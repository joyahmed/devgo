[package]
name = "devgo"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devgo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
thiserror = "2.0.20"
tauri-plugin-global-shortcut = "2"


# size leaning: a launcher's exe is read from disk on every cold start and
# nothing in it is hot enough for opt-level 3 to matter. no panic = "abort":
# keep the unwind so a panicking command surfaces as an error the frontend
# can toast, not a dead process
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
