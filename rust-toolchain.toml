# the one place the rust version is written down. rustup reads this file by
# walking UP from wherever cargo was invoked, so it lives at the REPO ROOT and
# not in src-tauri/: ci runs `cargo --manifest-path src-tauri/Cargo.toml` with
# the repo root as its working directory, and scripts/verify.sh cds into
# src-tauri/ first. only a root file is on both of those walks. a copy in
# src-tauri/ would pin the local gate and leave ci floating — the exact skew
# this file exists to kill.
#
# why pinned at all: local stable was 1.96.1 (2026-06-26) while ci's
# dtolnay/rust-toolchain@stable resolved to 1.98.1 (2026-09-01). ci's newer
# clippy carried a lint the older one did not have (`chunks_exact` with a
# constant chunk size), so verify.sh reported GREEN on the exact tree ci run
# 36198910630 rejected on all three platforms. a gate that disagrees with the
# gate that blocks a release is not a gate.
#
# 1.98.1 is *current* stable, not the stale local one — pinning does not cost
# us any lint ci had. what it changes is timing: new lints now arrive when
# someone edits this line, not unannounced on the morning rust ships a release.
#
# to bump: `rustup update stable && rustup toolchain list` to see what stable
# now is, change the channel below to that exact x.y.z, then run
# `sh scripts/verify.sh --full` and fix whatever the newer clippy found. one
# line, one commit, and ci follows automatically because it reads this file.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
