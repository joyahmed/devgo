# the same gate the release runs, on every push and every pull request.
# one job per platform the release ships, because a #[cfg(target_os)] arm is
# compiled by nothing but the platform it names: the mac and linux arms used to
# be first compiled by the tag build, which is after the decision to release —
# the worst moment to learn the code does not build. runners for the other two
# are free on a public repo, so the gate pays for itself the first time.
# every job clippies and tests: --all-targets compiles every arm, so one step
# answers "does it build" and "is it clean" at once — but it never RUNS a test,
# and a mac/linux job that stopped at clippy left the #[cfg(unix)] tests first
# executed by a tag build, which is how a broken one reached v1.2.2-rc1. the
# windows job additionally keeps the frontend build and fmt, so ci stops being
# weaker than scripts/verify.sh.
name: ci

on:
  # every branch, not just main: work that never opens a pull request — most of
  # this repo's — was reaching main having been checked by nothing. '**' matches
  # slashes, so 78.file-manager and friends count; tags are left out because a
  # v* tag is release.yml's job and would otherwise run this twice.
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # no rust-toolchain action on purpose: rust-toolchain.toml at the repo
      # root names the version and its components, and the runners' rustup
      # honours it — the first cargo call below auto-installs 1.98.1 with
      # clippy and rustfmt. installing "stable" here would be worse than
      # redundant: the file overrides it, so the job would download a toolchain
      # it never uses and THEN download the pinned one. the cost is one cold
      # rustup install per job (~30s, ~200MB) on a cache miss, paid once per
      # bump since Swatinem/rust-cache keys on `rustc -vV`. the version stays
      # in exactly one file — repeating it here is how the two drift again.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # the server contract: the two scripts parse, the example is json
      - run: |
          bash -n server/devgo-inventory.sh
          bash -n server/site-new.sh
          jq empty server/devgo-actions.example.json
        shell: bash
      # fmt needs no build, so it fails in seconds when it fails at all
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        shell: bash
      - run: bun install --frozen-lockfile
      # dist/ is gitignored, and generate_context! wants frontendDist to exist,
      # so the frontend build comes before anything that compiles the crate
      - run: bun run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        shell: bash
      - run: cargo test --manifest-path src-tauri/Cargo.toml || cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
        shell: bash

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # toolchain comes from rust-toolchain.toml — see the gate job
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # clippy compiles every target but runs no test, so the #[cfg(unix)]
      # tests had never once executed here — the first run of them was a tag
      # build. same line and same single-threaded retry as the gate job above
      - run: cargo test --manifest-path src-tauri/Cargo.toml || cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
        shell: bash

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # toolchain comes from rust-toolchain.toml — see the gate job
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri links against webkit2gtk and gtk and the runner ships neither
      # -dev package; without these the build dies in cargo with a pkg-config
      # error naming a .pc file. same list as scripts/build-linux.sh, pinned
      # to 24.04 because that is where webkit2gtk-4.1 was verified
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # see the mac job: clippy is not a test run
      - run: cargo test --manifest-path src-tauri/Cargo.toml || cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
        shell: bash
