# a v* tag builds the installers and drafts the github release; the
# maintainer publishes the draft. run workflow from a tag does the same
# by hand.
# no certificate on any platform on purpose, and the readme tells the user
# what the os will say. mac is the one place that still needs a signature:
# the arm64 linker ad-hoc signs the binary, and a bundle whose executable is
# signed but whose _CodeSignature is missing reads as "damaged", which has no
# override. bundle.macOS.signingIdentity "-" makes the bundler codesign the
# .app itself, so the seal is whole and gatekeeper says "unidentified
# developer" instead.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # the server contract: the two scripts parse, the example is json. same
      # step as ci.yml's gate job, and in the same place — these are syntax
      # checks on shell and json, so they need no toolchain and no build and
      # fail in seconds. windows only, for the reason fmt is windows only:
      # nothing about them is platform-dependent, so a second and third run
      # would buy nothing. jq is preinstalled on the github runner images and
      # ci.yml installs it nowhere either
      - run: |
          bash -n server/devgo-inventory.sh
          bash -n server/site-new.sh
          jq empty server/devgo-actions.example.json
        shell: bash
      # the same gate ci.yml runs on every push, in the same order and the
      # same per-platform shape: a tag must not be able to ship what a branch
      # commit would have been refused for. fmt needs no build, so it fails in
      # seconds when it fails at all, and it lives only here because
      # formatting is the one check that is platform-independent
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        shell: bash
      - run: bun install --frozen-lockfile
      # before the build so a red frontend test is never hidden behind a build
      # failure, and in all three jobs: jsdom is portable but this repo's path
      # handling has not been — see ci.yml
      - run: bun run test
      - run: bun run build
      # after the build: dist/ is gitignored and generate_context! wants
      # frontendDist to exist before anything compiles the crate. --all-targets
      # compiles every arm this platform names, so it is a per-platform check
      # and not a cheap one that could be hoisted into a single shared job
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        shell: bash
      # the launcher tests share temp names; a second pass on one thread
      # tells a race from a failure
      - run: cargo test --manifest-path src-tauri/Cargo.toml || cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
        shell: bash
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DevGo ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

  mac:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # see the windows job: the frontend suite runs everywhere, before the
      # build. no fmt here — the windows job is the one place it is checked
      - run: bun run test
      - run: bun run build
      # --all-targets compiles every #[cfg(target_os = "macos")] arm, which
      # nothing but this runner does
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml || cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
        shell: bash
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DevGo ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin --bundles dmg

  linux:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri links against webkit2gtk and gtk and the runner ships neither
      # -dev package; without these the build dies in cargo with a pkg-config
      # error naming a .pc file. same list as scripts/build-linux.sh, pinned
      # to 24.04 because that is where webkit2gtk-4.1 was verified
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      # see the windows job: the frontend suite runs everywhere, before the
      # build. no fmt here — the windows job is the one place it is checked
      - run: bun run test
      - run: bun run build
      # --all-targets compiles every #[cfg(target_os = "linux")] arm, which
      # nothing but this runner does
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml || cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
        shell: bash
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DevGo ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles deb
